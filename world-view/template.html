<title>Oakland, One Week</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: one full-screen flight down a street at dusk; the place is the page, words float on it. Single dark look by choice. */
:root {
  color-scheme: dark;
  --night: #0b0d1a;
  --ink: #f6ecd9;
  --dim: #b9b1c4;
  --veil: rgba(11, 13, 26, .62);
  --edge: rgba(246, 236, 217, .22);
  --gold: #ffc94d;
  --move: #6fd3ff;
  --hard: #ff6b5e;
  --tie: #ff9ecb;
  --sport: #7be08a;
  --plain: #f3e6cf;
  --display: "Bricolage Grotesque", "Avenir Next Condensed", "Trebuchet MS", sans-serif;
  --story: "Newsreader", Georgia, "Times New Roman", serif;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--display); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
#fade { position: fixed; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; transition: opacity .38s ease; }
#fade.on { opacity: 1; }

.hud { position: fixed; left: 0; right: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hud > * { pointer-events: auto; }
#top { top: 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: 40px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start;
  background: linear-gradient(to bottom, rgba(11,13,26,.72), rgba(11,13,26,0)); }
#where { min-width: 0; text-shadow: 0 2px 18px rgba(0,0,0,.7); pointer-events: none; }
#hood { margin: 0; font-weight: 800; font-size: clamp(30px, 7vw, 68px); line-height: .95; letter-spacing: -.02em; text-wrap: balance; }
#canon { margin: 8px 0 0; font: italic 400 clamp(16px, 2.4vw, 21px)/1.25 var(--story); max-width: 34ch; text-wrap: balance; }
#facts { margin: 6px 0 0; font-size: 13px; color: var(--dim); max-width: 46ch; line-height: 1.4; }
#facts b { color: var(--ink); font-weight: 500; }
#keys { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: 500 13px var(--display); color: var(--ink); background: var(--veil); border: 1px solid var(--edge); border-radius: 999px;
  padding: 9px 14px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
button:hover { border-color: var(--ink); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
#legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--dim); text-shadow: 0 1px 8px rgba(0,0,0,.8); pointer-events: none; }
#legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
#bar { height: 2px; background: var(--edge); pointer-events: none; }
#bar span { display: block; height: 100%; width: 0; background: var(--ink); }

.tag { position: fixed; left: 0; top: 0; width: max-content; max-width: min(300px, 44vw); pointer-events: none; opacity: 0;
  transition: opacity .5s ease; will-change: transform; }
.tag .card { background: var(--veil); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 11px; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
.tag .who { font-weight: 800; font-size: 14px; letter-spacing: .01em; display: flex; align-items: center; gap: 7px; }
.tag .who i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tag .line { font: italic 400 16px/1.28 var(--story); margin-top: 2px; }
.tag .more { font-size: 11px; color: var(--dim); margin-top: 3px; }


#places { position: fixed; inset: 0; background: var(--veil); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); overflow-y: auto;
  padding-block: calc(70px + env(safe-area-inset-top, 0px)) 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#places ul { list-style: none; margin: 0 auto; padding: 0; max-width: 720px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
#places li button { width: 100%; text-align: left; border-radius: 10px; padding: 12px 14px; font-size: 17px; font-weight: 800; }
#places li small { display: block; font-weight: 500; font-size: 12px; color: var(--dim); margin-top: 3px; }
#note { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 34ch; text-align: center; font: italic 400 18px/1.4 var(--story); }
@media (max-width: 560px) { #keys button { padding: 8px 11px; font-size: 12px; } .tag .line { font-size: 14px; } #facts { font-size: 12px; } }
@media (prefers-reduced-motion: reduce) { #fade, .tag { transition: none; } }
</style>

<div id="stage"></div>
<div id="tags"></div>
<div class="hud" id="top">
  <div id="where"><h1 id="hood">Oakland</h1><p id="canon"></p><p id="facts"></p></div>
  <div id="keys">
    <button id="bPlay" type="button">Pause</button>
    <button id="bNext" type="button">Next place</button>
    <button id="bPlaces" type="button">Places</button>
  </div>
</div>
<div class="hud" id="bottom">
  <div id="legend">
    <span><i style="background:var(--gold)"></i>a turning point</span>
    <span><i style="background:var(--move)"></i>moved</span>
    <span><i style="background:var(--tie)"></i>family and ties</span>
    <span><i style="background:var(--hard)"></i>a hard week</span>
    <span><i style="background:var(--sport)"></i>the game</span>
    <span><i style="background:var(--plain)"></i>an ordinary week</span>
  </div>
  <div id="bar"><span></span></div>
</div>
<div id="places" hidden><ul id="placeList"></ul></div>
<div id="fade"></div>
<p id="note" hidden>This flight needs 3D graphics, and this browser has them turned off.</p>

  if (w.temp) bits.push(w.temp + '°, ' + (w.streakType || w.type));
  $('hood').textContent = H.name;
  $('canon').textContent = world.ST.q ? '“' + world.ST.q + '”' : '';
  $('facts').innerHTML = 'Week ' + DATA.cycle + '. ' + bits.join(' · ') + '.';
}
function go(idx, startAt) {
  if (busy) return; busy = true; $('fade').classList.add('on');
  setTimeout(function () {
    if (world) { scene.remove(world.root); dispose(world.root); }
    POOL.forEach(function (s) { setTag(s, null); });
    cur = (idx + DATA.hoods.length) % DATA.hoods.length; world = build(cur); facts();
    if (startAt) world.z = 10 - (10 - world.gz) * startAt;
    step(0); renderer.render(scene, camera);
    $('fade').classList.remove('on'); busy = false;
  }, world ? 400 : 0);
}
function step(dt) {
  var W = world; W.t += dt; if (playing) W.z -= SPEED * dt;
  var t = W.t, a = W.halos.geometry.attributes.position.array;
  for (var i = 0; i < W.people.length; i++) {
    var p = W.people[i]; p.z = p.z0 + Math.sin(t * p.sp + p.ph) * 1.6;
    var bob = Math.abs(Math.sin(t * 3.2 * p.sp * 2 + p.ph)) * 0.05, y = W.yAt(p.z);
    M4.makeScale(p.sc, p.sc, p.sc); M4.setPosition(p.x, 0.16 + bob + y, p.z);
    W.bodies.setMatrixAt(i, M4); W.heads.setMatrixAt(i, M4);
    a[i * 3] = p.x; a[i * 3 + 1] = 2.25 * p.sc + bob + y; a[i * 3 + 2] = p.z;
  }
  W.bodies.instanceMatrix.needsUpdate = true; W.heads.instanceMatrix.needsUpdate = true; W.halos.geometry.attributes.position.needsUpdate = true;
  W.diskMat.uniforms.t.value = t;
  if (W.glints) W.glints.material.opacity = 0.45 + Math.sin(t * 1.7) * 0.15;
  if (W.beaconPts) W.beaconPts.material.opacity = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.3));
  if (W.train) W.train.position.x = ((t * 16) % 300) - 170;
  var z = W.z, near = Math.max(0, Math.min(1, (z - W.gz) / 30));
  camera.position.set(Math.sin(t * 0.21) * 1.5 * near, 2.35 + Math.sin(t * 0.37) * 0.18 + (1 - near) * 2.4 + W.yAt(z), z);
  camera.lookAt(Math.sin(t * 0.13 + 1) * 2.2 * near, 2.2 + (1 - near) * 2.8 + W.yAt(z - 20), z - 20);
  sky.position.copy(camera.position);
  $('bar').firstElementChild.style.width = (Math.max(0, Math.min(1, (10 - z) / (10 - W.gz))) * 100).toFixed(1) + '%';
  if (z < W.gz + 1.5 && !busy) go(cur + 1);
}
function loop(now) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!world || busy) return;
  step(dt);
  if (frame++ % 8 === 0) pickTags();
  placeTags();
  renderer.render(scene, camera);
}

// ---------- controls ----------
function setPlay(v) { playing = v; $('bPlay').textContent = v ? 'Pause' : 'Play'; }
$('bPlay').addEventListener('click', function () { setPlay(!playing); });
$('bNext').addEventListener('click', function () { go(cur + 1); });
$('bPlaces').addEventListener('click', function () { var p = $('places'); p.hidden = !p.hidden; $('bPlaces').textContent = p.hidden ? 'Places' : 'Close'; });
DATA.hoods.forEach(function (H, i) {
  var li = document.createElement('li'), b = document.createElement('button'); b.type = 'button';
  b.textContent = H.name; var s = document.createElement('small'); s.textContent = H.total + ' people · ' + H.lines + ' things happened'; b.appendChild(s);
  b.addEventListener('click', function () { $('places').hidden = true; $('bPlaces').textContent = 'Places'; go(i); });
  li.appendChild(b); $('placeList').appendChild(li);
});
window.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'BUTTON' && e.code === 'Space') return;
  if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
  else if (e.code === 'ArrowRight') go(cur + 1);
  else if (e.code === 'ArrowLeft') go(cur - 1);
  else if (e.code === 'Escape') { $('places').hidden = true; $('bPlaces').textContent = 'Places'; }
});
setPlay(playing);
// a link can open on one place: #west-oakland, or #west-oakland-mid to start halfway down the street
function fromHash() {
  var h = (location.hash || '').slice(1), mid = /-mid$/.test(h); if (mid) h = h.replace(/-mid$/, '');
  for (var k = 0; k < DATA.hoods.length; k++) if (slug(DATA.hoods[k].name) === h) return [k, mid ? 0.36 : 0];
  return [0, 0];
}
function start() { var f = fromHash(); go(f[0], f[1]); requestAnimationFrame(loop); }
window.addEventListener('hashchange', function () { var f = fromHash(); go(f[0], f[1]); });
if (document.fonts && document.fonts.ready) { var done = false, kick = function () { if (!done) { done = true; start(); } }; document.fonts.ready.then(kick); setTimeout(kick, 1500); } else start();
})();
</script>
