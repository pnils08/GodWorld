<title>Oakland, One Week</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one full-screen street at dusk; the place is the page, words float on it. Single dark look by choice. */
:root {

}
[hidden] { display: none !important; }

#facts { margin: 6px 0 0; font-size: 13px; color: var(--dim); max-width: 46ch; line-height: 1.4; }

#bMore { padding-inline: 13px; letter-spacing: .08em; }

  padding: 9px 14px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button:hover { border-color: var(--ink); }

#bottom { z-index: 2; bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
#pad { display: flex; gap: 10px; justify-content: center; }
#pad button { width: 64px; height: 52px; font-size: 20px; padding: 0; }
#hint { font-size: 12px; color: var(--dim); text-shadow: 0 1px 8px rgba(0,0,0,.8); margin: 0; }

.tag { max-width: min(300px, 44vw); }

.ctag.nl { border-color: rgba(255,201,77,.6); } .ctag.nl b i { background: #ffc94d; border-radius: 50%; transform: none; }
.ctag.ni { border-color: rgba(111,211,255,.6); } .ctag.ni b i { background: #6fd3ff; border-radius: 50%; transform: none; }
.ctag.np { border-color: rgba(243,230,207,.5); } .ctag.np b i { background: #f3e6cf; border-radius: 50%; transform: none; }
.ctag.nc { border-color: rgba(255,158,203,.55); } .ctag.nc b i { background: #ff9ecb; border-radius: 50%; transform: none; }
.ctag.nw { border-color: rgba(255,107,94,.55); } .ctag.nw b i { background: #ff6b5e; border-radius: 50%; transform: none; }
.ctag.nx { border-color: rgba(243,230,207,.4); } .ctag.nx b i { background: #cfc4ae; border-radius: 50%; transform: none; }
.ctag.nt { border-color: rgba(170,176,186,.6); } .ctag.nt b i { background: #aab0ba; border-radius: 50%; transform: none; }
.ctag.nf span, .ctag.ns span, .ctag.nl span, .ctag.ni span, .ctag.np span, .ctag.nc span, .ctag.nt span, .ctag.nw span, .ctag.nx span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
body.words .tag { max-width: min(340px, 62vw); }

body.words .tag .line { font: 500 12px/1.3 var(--display); color: var(--dim); margin-top: 6px; }
body.words .tag .card { display: flex; flex-direction: column; }
body.words .tag .line, body.words .tag .more { order: 5; }
.chip { font-weight: 500; font-size: 11px; background: rgba(11,13,26,.5); border-radius: 999px; padding: 2px 8px 2px 6px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip i { width: 6px; height: 6px; }

#places { z-index: 2; position: fixed; inset: 0; background: var(--veil); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); overflow-y: auto;
  padding-block: calc(70px + env(safe-area-inset-top, 0px)) 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#cityMap { display: block; width: 100%; max-width: 900px; margin: 0 auto 6px; touch-action: manipulation; }
#cityMap line { stroke: rgba(243,230,207,.22); stroke-width: 2; }

#cityMap circle { stroke: rgba(11,13,26,.9); stroke-width: 3; }

#cityMap.tall text { font-size: 30px; } #cityMap.tall text.sub { font-size: 22px; }
#mapNote { max-width: 720px; margin: 0 auto 18px; font-size: 12px; color: var(--dim); line-height: 1.4; text-align: center; }
#facts button.nums { pointer-events: auto; background: none; border: 0; border-radius: 4px; padding: 0; font: inherit; color: var(--ink); text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; backdrop-filter: none; -webkit-backdrop-filter: none; cursor: pointer; }
#places ul { list-style: none; margin: 0 auto; padding: 0; max-width: 720px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
#places li button { width: 100%; text-align: left; border-radius: 10px; padding: 12px 14px; font-size: 17px; font-weight: 800; }
#places li small { display: block; font-weight: 500; font-size: 12px; color: var(--dim); margin-top: 3px; }
#people { z-index: 2; position: fixed; inset: 0; background: var(--veil); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); overflow-y: auto;
  padding-block: calc(70px + env(safe-area-inset-top, 0px)) 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#people .in { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
#people label { font-size: 12px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
#q { font: 500 18px var(--display); color: var(--ink); background: rgba(11,13,26,.7); border: 1px solid var(--edge); border-radius: 10px; padding: 12px 14px; width: 100%; box-sizing: border-box; }
#q:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#people ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
#people li button { width: 100%; text-align: left; border-radius: 10px; padding: 10px 14px; font-size: 16px; font-weight: 800; }
#people li button:disabled { opacity: .6; cursor: default; }
#people li small { display: block; font-weight: 500; font-size: 12px; color: var(--dim); margin-top: 2px; }
#pcount { font-size: 12px; color: var(--dim); margin: 0; }
#person { z-index: 4; position: fixed; right: 0; top: 0; bottom: 0; width: min(430px, 100%); box-sizing: border-box; overflow-y: auto; background: rgba(11,13,26,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-left: 1px solid var(--edge);
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
#person h2 { margin: 10px 0 0; font-weight: 800; font-size: clamp(28px, 5vw, 40px); line-height: 1; letter-spacing: -.02em; text-wrap: balance; }
#person .pmeta { margin: 6px 0 0; font-size: 13px; color: var(--dim); line-height: 1.45; }
#person h3 { margin: 22px 0 8px; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
#person p.bio { margin: 14px 0 0; font: italic 400 17px/1.42 var(--story); }
#person ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
#person li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; line-height: 1.35; }
#person li i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; transform: translateY(-1px); }
#person li span.when { color: var(--dim); font-size: 12px; flex-shrink: 0; min-width: 3.4em; font-variant-numeric: tabular-nums; }
#person button.link { background: none; border: 0; border-radius: 4px; padding: 0; font: inherit; color: var(--ink); text-align: left; text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; backdrop-filter: none; -webkit-backdrop-filter: none; }

#person blockquote { margin: 0 0 14px; font: italic 400 17px/1.4 var(--story); }
#person blockquote footer { font: 500 11px/1.3 var(--display); color: var(--dim); margin-top: 4px; font-style: normal; }
@media (max-width: 720px) { #person { top: auto; left: 0; width: auto; max-height: 56%; border-left: 0; border-top: 1px solid var(--edge); border-radius: 16px 16px 0 0; padding-left: max(18px, env(safe-area-inset-left, 0px)); } }
body.visit #bottom, body.visit #keys { display: none; }
#note { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 34ch; text-align: center; font: italic 400 18px/1.4 var(--story); }
@media (max-width: 720px) { #top { flex-wrap: nowrap; flex-direction: column; } #keys { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; max-width: 100%; padding-bottom: 6px; padding-right: 36px; box-sizing: border-box; scrollbar-width: none; pointer-events: auto; -webkit-overflow-scrolling: touch; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 44px), transparent); } #keys::-webkit-scrollbar { display: none; } #keys button { flex-shrink: 0; } #bMore { order: -1; } #keys.open { flex-wrap: wrap; overflow: visible; -webkit-mask-image: none; mask-image: none; padding-right: 0; } }

<div id="stage"></div>
<div id="tags"></div>
<div class="hud" id="top">
  <div id="where"><h1 id="hood">Oakland</h1><p id="canon"></p><p id="facts"></p></div>
  <div id="keys">
    <button id="bPeople" type="button">People</button>
    <button id="bPlaces" type="button">Places</button>
    <button id="bWalk" type="button" aria-pressed="false">Walk it yourself</button>
    <button id="bPlay" type="button">Pause</button>
    <button id="bNext" type="button">Next place</button>
    <button id="bMore" type="button" aria-expanded="false" aria-label="Settings">&#8943;</button>
    <button id="bPace" class="x" type="button">Pace: normal</button>
    <button id="bLabels" class="x" type="button">Cards: on</button>
    <button id="bWords" class="x" type="button" aria-pressed="false">Their words</button>
    <button id="bSound" class="x" type="button" aria-pressed="false" hidden>Sound</button>
  </div>
</div>
<div class="hud" id="bottom">
  <div id="pad" hidden>
    <button id="pL" type="button" aria-label="Turn left">&#8630;</button>
    <button id="pF" type="button" aria-label="Walk forward">&#9650;</button>
    <button id="pB" type="button" aria-label="Walk back">&#9660;</button>
    <button id="pR" type="button" aria-label="Turn right">&#8631;</button>
  </div>
  <p id="hint"></p>
  <p id="tip">Tap a person, a shop sign or a home to open it.</p>
  <div id="legend">
    <span><i style="background:var(--gold)"></i>a turning point</span>
    <span><i style="background:var(--move)"></i>moved</span>
    <span><i style="background:var(--tie)"></i>family and ties</span>
    <span><i style="background:var(--hard)"></i>a hard week</span>
    <span><i style="background:var(--sport)"></i>the game</span>
    <span><i style="background:var(--plain)"></i>an ordinary week</span>
  </div>
  <div id="bar"><span></span></div>
</div>
<div id="places" hidden><svg id="cityMap" role="img" aria-label="The neighborhoods, drawn by which border which"></svg><p id="mapNote"></p><ul id="placeList"></ul></div>
<div id="people" hidden><div class="in">
  <label for="q">Find someone by name, job or neighborhood</label>
  <input id="q" type="search" autocomplete="off" spellcheck="false">
  <p id="pcount"></p>
  <ul id="peopleList"></ul>
</div></div>
<aside id="person" hidden aria-live="polite">
  <button id="bBack" type="button">Back to the street</button>
  <h2 id="pName"></h2><p class="pmeta" id="pMeta"></p><p class="bio" id="pBio"></p>
  <div id="pBody"></div>
</aside>
<div id="fade"></div>
<p id="note" hidden>This flight needs 3D graphics, and this browser has them turned off.</p>
